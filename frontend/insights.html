<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance Ingestion App — Insights</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <h1>Insights</h1>
      <nav>
        <a href="index.html">Upload &amp; Review</a>
        <a href="insights.html" aria-current="page">Insights</a>
      </nav>
    </header>

    <section class="panel">
      <h2>Balance trend</h2>
      <p class="eyebrow">Accounts whose source files carry a running balance (BoA Checking, Fidelity Savings).</p>
      <canvas id="balance-chart" width="1100" height="280"></canvas>
      <div id="balance-empty" class="empty-state" hidden></div>
    </section>

    <div class="split">
      <section class="panel">
        <h2>Category totals by month</h2>
        <div class="table-scroll">
          <table id="category-table"></table>
        </div>
        <div id="category-empty" class="empty-state" hidden></div>
      </section>

      <section class="panel">
        <h2>Calculator — EOM reconciliation</h2>
        <div id="calculator-summary" class="calc-summary muted"></div>
        <div id="calculator-list"></div>
        <div id="calculator-empty" class="empty-state" hidden></div>
        <div id="calculator-error" class="field-error" hidden></div>
      </section>
    </div>
  </div>

  <script src="insights.js"></script>
</body>
</html>
